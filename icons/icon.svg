<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Zquiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- 底:圆角方(radius = 22%),主色渐变,与站内 --c-primary 一系 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Z 元素:两横 + 一斜(三块拼)。缩到 88% 并往左上让位,把右下角留给对勾徽章 -->
  <g transform="translate(6.7,12.7) scale(0.88)">
    <rect x="156" y="146" width="200" height="56" rx="10" fill="#fff"/>
    <rect x="156" y="310" width="200" height="56" rx="10" fill="#fff"/>
    <polygon points="300,202 356,202 212,310 156,310" fill="#fff"/>
  </g>
  <!-- 刷题元素:对勾徽章(= 答对)。蓝环是"镂空圈",把徽章与 Z 分开;白勾压深绿,小尺寸也认得出 -->
  <circle cx="368" cy="352" r="74" fill="#12a150" stroke="#2b6ade" stroke-width="14"/>
  <polyline points="338,354 360,376 400,330" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
