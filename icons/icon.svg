<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Zquiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- 底:圆角方(radius = 22%),主色渐变 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 书本元素:立着的书,占画布 62.5%(320/512,四边留 96)。
       ⚠️ 这一套(icon-192/512、apple-touch、favicon)是 62.5%;
          **maskable.svg 单独画 50%** —— 安卓会把 maskable 放大约 1.25 倍再套遮罩,
          62.5% 过那一道就成了 78%,真机上看着"主体太大、占满整个方形"(👤 2026-09-14 报的)。
          两张的差别只在这一点上,别把 maskable 也改回 62.5%,也别把蓝底缩小(那是另一个错)。 -->
  <rect x="96" y="96" width="320" height="320" rx="20" fill="#fff"/>
  <rect x="96" y="96" width="44" height="320" rx="20" fill="#dbeafe"/>
  <rect x="140" y="96" width="6" height="320" fill="#bfdbfe"/>
  <!-- Z 元素:写在书封面上(蓝字压白封面,对比足) -->
  <g fill="#1d4ed8">
    <rect x="191" y="156" width="180" height="52" rx="9"/>
    <rect x="191" y="304" width="180" height="52" rx="9"/>
    <polygon points="325,208 371,208 237,304 191,304"/>
  </g>
  <!-- 刷题元素:右下角绿色对勾徽章(= 答对)。蓝环镂空,把徽章从书上"抠"出来 -->
  <circle cx="398" cy="376" r="56" fill="#12a150" stroke="#2b6ade" stroke-width="12"/>
  <polyline points="370,376 386,392 420,354" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
