<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Zquiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- 底:**全幅铺满**(maskable 由系统裁形,底必须顶到边,不许留透明缝) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 主体:书占画布 **50%**(256/512,四边留 128)。
       🚨 为什么 maskable 反而要画得比其它四张**小**:
       安卓把 maskable 图标**放大约 1.25 倍**再套遮罩(让 80% 安全圈正好填满遮罩),
       62.5% 的图过这一道就成了 78% —— 真机上看着"主体太大、占满整个方形"(👤 2026-09-14 报的)。
       画 50% ⇒ 放大后 ≈62.5%,与 icon-512 / apple-touch 在真机上**看起来一样大**。
       ⚠️ 别把蓝底一起缩小(那是另一个错:同一套图标里大小不一,👤 曾报"有的太小了")。 -->
  <rect x="128" y="128" width="256" height="256" rx="16" fill="#fff"/>
  <rect x="128" y="128" width="35" height="256" rx="16" fill="#dbeafe"/>
  <rect x="163" y="128" width="5" height="256" fill="#bfdbfe"/>
  <!-- Z 元素:写在书封面上(蓝字压白封面,对比足) -->
  <g fill="#1d4ed8">
    <rect x="204" y="176" width="144" height="42" rx="7"/>
    <rect x="204" y="294" width="144" height="42" rx="7"/>
    <polygon points="311,218 348,218 241,294 204,294"/>
  </g>
  <!-- 刷题元素:绿色对勾徽章(= 答对)。蓝环镂空,把徽章从书上"抠"出来。
       ⚠️ 位置比 icon.svg 里更靠内:徽章外缘离中心 169 < 205(80% 安全圈半径),
          否则圆形/圆角遮罩会把对勾切掉一半。 -->
  <circle cx="340" cy="340" r="45" fill="#12a150" stroke="#2b6ade" stroke-width="10"/>
  <polyline points="318,340 330,353 358,322" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
